include: package:flutter_lints/flutter.yaml

analyzer:
  # No silent dynamic: a loop over `x ?? const []` once inferred dynamic elements, and a dynamic call with an
  # int where Rect.inflate needs a double broke every page on Android.
  exclude:
    - build/**
    - android/**
    - windows/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_dynamic_calls
